<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>内心模式小探测</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",system-ui, -apple-system}
body{
  background: linear-gradient(135deg, #e6f0fc 0%, #edf4ff 50%, #e8eeff 100%);
  color:#1a365d;
  padding:28px 16px;
  max-width:740px;
  margin:0 auto;
  min-height:100vh;
}
.wrap{
  background:#ffffff;
  border-radius:20px;
  padding:32px 28px;
  box-shadow: 0 8px 24px rgba(43, 108, 176, 0.15);
  animation: fadeInUp 0.6s ease-out;
}
/* 顶部进度条 */
.progress-wrap{
  width:100%;
  height:6px;
  background:#dde6f5;
  border-radius:99px;
  margin-bottom:16px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  background: linear-gradient(90deg,#2b6cb0,#4277d8);
  border-radius:99px;
  transition: width 0.4s ease;
  width:0%;
}
@keyframes fadeInUp {
  0% {opacity:0;transform:translateY(20px);}
  100% {opacity:1;transform:translateY(0);}
}
/* 页面滑动动画 */
@keyframes slideInRight {
  from {opacity:0; transform: translateX(60px);}
  to {opacity:1; transform: translateX(0px);}
}
@keyframes slideInLeft {
  from {opacity:0; transform: translateX(-60px);}
  to {opacity:1; transform: translateX(0px);}
}
.slide-right{
  animation: slideInRight 0.35s ease forwards;
}
.slide-left{
  animation: slideInLeft 0.35s ease forwards;
}
@keyframes pulseBtn {
  0%{transform:scale(1);}
  50%{transform:scale(1.02);}
  100%{transform:scale(1);}
}
h1{
  background: linear-gradient(90deg,#2b6cb0,#4c68d7);
  -webkit-background-clip:text;
  color:transparent;
  font-size:24px;
  text-align:center;
  margin-bottom:10px;
}
.desc{
  text-align:center;
  color:#5474a3;
  font-size:14px;
  margin-bottom:20px;
}
.page-indicator{
  text-align:center;
  color:#4a70a8;
  margin-bottom:24px;
  font-size:14px;
}
.q-title{
  font-weight:500;
  margin-bottom:24px;
  font-size:17px;
  color:#244b82;
}
.op-item{
  margin:10px 0;
  cursor:pointer;
  padding:13px 16px;
  border-radius:12px;
  border:1px solid #c6dbf5;
  background:#f7faff;
  transition: all 0.25s ease;
}
.op-item:hover{
  background:#e1edfc;
  border-color:#8cb8e8;
  transform:translateX(4px);
}
.op-item.selected{
  background: linear-gradient(90deg,#2b6cb0,#4277d8);
  color:#ffffff;
  border-color:#3b7cd3;
  box-shadow:0 2px 8px rgba(43,108,176,0.25);
}
.btn-row{
  display:flex;gap:12px;margin-top:30px;
}
button{
  padding:13px;border:none;border-radius:12px;
  color:#fff;font-size:16px;cursor:pointer;
  transition: all 0.3s ease;
  flex:1;
}
.btn-prev{
  background:#89a8d3;
}
.btn-next{
  background: linear-gradient(90deg,#2b6cb0,#4277d8);
}
.btn-next:disabled{
  background:#a1bde2;
  cursor:not-allowed;
  animation:none;
}
.btn-next:hover:not(:disabled){
  animation:pulseBtn 0.8s infinite;
}
.result-wrap{
  display:none;
  margin-top:10px;
  animation: fadeInUp 0.7s ease;
}
.avatar-box{
  text-align:center;
  margin:24px 0;
}
.avatar-box>div{
  color:#3468b3;
  margin-bottom:10px;
  font-weight:500;
}
#rewardAvatar{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid;
  border-image: linear-gradient(135deg,#3182ce,#6379e8) 1;
  box-shadow:0 4px 14px rgba(66, 119, 216,0.22);
}
.report{
  background: linear-gradient(140deg,#f0f7ff,#f4f7ff);
  padding:24px;
  border-radius:16px;
  line-height:1.75;
  font-size:15px;
  border:1px solid #d8e8fb;
}
.report h3{
  color:#2b6cb0;
  margin-bottom:14px;
  font-size:18px;
}
.back-btn{
  width:100%;
  background: linear-gradient(90deg,#4a7fb8,#5c88d6);
  margin-top:20px;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>✨内心模式小探测</h1>
  <div class="desc">凭第一直觉选择，趣味性格小测试｜非专业心理量表</div>

  <!--进度条-->
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="quizBox">
    <div class="page-indicator" id="pageIndicator"></div>
    <div class="question-page" id="pageBody"></div>
    <div class="btn-row">
      <button class="btn-prev" id="prevBtn">上一题</button>
      <button class="btn-next" id="nextBtn">下一题</button>
    </div>
  </div>

  <div class="result-wrap" id="resultWrap">
    <div class="avatar-box">
      <div>🎁测试奖励头像</div>
      <img id="rewardAvatar" src="./cat.png" alt="奖励头像"/>
    </div>
    <div class="report">
      <h3>你的内心模式探测报告</h3>
      <div id="reportContent"></div>
    </div>
    <button class="back-btn" onclick="resetQuiz()">重新测试</button>
  </div>
</div>

<script>
const questions = [
  { q:"1.挑选随身小物件时你的倾向", opts:["A 优先实用耐用，外观过得去即可","B 优先观感审美，基础功能够用就好"] },
  { q:"2.日常佩戴耳机更偏好", opts:["A 不封闭耳道，可以听见周遭环境声音","B 隔绝外界噪音，拥有私人听觉空间"] },
  { q:"3.更容易被哪一类音乐触动", opts:["A 舒缓安静，氛围感强","B 节奏浓烈，情绪冲击力强","C 广为流传的大众热门曲目","D 小众冷门，受众不多的作品"] },
  { q:"4.对待待办的事情，你更习惯", opts:["A 提前规划妥当，一切确定才安心","B 随情况调整，接纳随机的变化"] },
  { q:"5.面临重要抉择，你的状态", opts:["A 多方权衡，会犹豫很久再定下来","B 快速做出判断，愿意承担试错结果"] },
  { q:"6.日常社交当中你的固有模式", opts:["A 偏向被动，等待别人主动靠近","B 偏向主动，会主动发起交流"] },
  { q:"7.他人给予反馈，更能驱动你的是", opts:["A 夸奖与正向肯定","B 指出不足的批评建议"] },
  { q:"8.与他人产生观点分歧时", opts:["A 直接表达自身想法，不刻意迂回","B 缓和气氛，尽量避免冲突激化"] },
  { q:"9.疲惫之后恢复精神，你更喜欢", opts:["A 安静独处，不受外界打扰","B 热闹环境，有人陪伴相处"] },
  { q:"10.接触完全陌生的新鲜事物", opts:["A 先观察了解，再亲身尝试","B 直接上手体验，不怕出错踩坑"] },
  { q:"11.面对许久未见、很久不联系的人突然来找你", opts:["A 会有点拘谨，慢慢找回相处节奏","B 自然熟络，很快就能恢复往日状态","C 内心会有所戒备，保持距离感"] },
  { q:"12.陌生人主动过来和你谈论相关你的事情", opts:["A 有点不适，下意识防备","B 平常心，可以简单礼貌应付","C 乐于交谈，愿意敞开去沟通"] },
  { q:"13.面对过往留下的遗憾", opts:["A 时常回想，容易反复纠结内耗","B 快速放下，很少回头沉浸过去"] },
  { q:"14.计划被别人临时打乱的时候", opts:["A 会感到烦躁，不太适应变动","B 可以接受，灵活调整即可"] }
];

let currentPage = 0;
let answers = Array(questions.length).fill(null);

const quizBox = document.getElementById('quizBox');
const resultWrap = document.getElementById('resultWrap');
const pageIndicator = document.getElementById('pageIndicator');
const pageBody = document.getElementById('pageBody');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const reportContent = document.getElementById('reportContent');
const progressBar = document.getElementById('progressBar');

// 更新进度条
function updateProgress(){
  const percent = ((currentPage+1)/questions.length)*100;
  progressBar.style.width = `${percent}%`;
}

// direction true=向右翻页(下一题) false=向左翻页(上一题)
function renderPage(direction=true){
  const item = questions[currentPage];
  pageIndicator.innerText = `第 ${currentPage+1} / ${questions.length} 题`;
  pageBody.innerHTML = `<div class="q-title">${item.q}</div>`;
  item.opts.forEach((opt,oi)=>{
    const div = document.createElement('div');
    div.className = "op-item";
    div.innerText = opt;
    if(answers[currentPage] === oi) div.classList.add('selected');
    div.onclick = ()=>{
      answers[currentPage] = oi;
      renderPage(direction);
    }
    pageBody.appendChild(div);
  })
  // 翻页动画
  pageBody.className = direction ? "question-page slide-right" : "question-page slide-left";
  updateProgress();

  prevBtn.style.visibility = currentPage===0 ? "hidden":"visible";
  if(answers[currentPage] === null){
    nextBtn.disabled = true;
    nextBtn.innerText = "下一题";
  }else{
    nextBtn.disabled = false;
    nextBtn.innerText = (currentPage === questions.length-1) ? "查看报告" : "下一题";
  }
}

prevBtn.onclick = function(){
  if(currentPage>0){
    currentPage--;
    renderPage(false);
  }
}

nextBtn.onclick = function(){
  if(currentPage < questions.length-1){
    currentPage++;
    renderPage(true);
  }else{
    generateReport();
    quizBox.style.display = 'none';
    resultWrap.style.display = 'block';
  }
}

function resetQuiz(){
  currentPage = 0;
  answers = Array(questions.length).fill(null);
  quizBox.style.display = 'block';
  resultWrap.style.display = 'none';
  renderPage(true);
}

function generateReport(){
  const a = answers;
  const baseColor = a[0]===0 ? "务实型" : "感受型";
  const materialView = a[0]===0 ? "实际使用价值" : "审美情绪体验";
  const audioMind = a[1]===0 ? "和外界保持连通" : "拥有隔绝干扰的私人空间";

  let musicText,musicInner;
  if(a[2]===0){ musicText="舒缓安静氛围感"; musicInner="内心细腻，偏爱平和松弛的情绪"; }
  else if(a[2]===1){ musicText="节奏浓烈冲击力强"; musicInner="情绪外放，生命力充沛"; }
  else if(a[2]===2){ musicText="大众热门曲目"; musicInner="乐于融入群体，看重共鸣感"; }
  else { musicText="小众冷门作品"; musicInner="追求自我独特，不喜欢随大流"; }

  const planText = a[3]===0 ? "看重确定规划，讨厌突发打乱" : "接纳变数，适应随性变化";
  const decideType = a[4]===0 ? "审慎思虑型" : "果敢行动型";
  const socialMode = a[5]===0 ? "被动慢热，等待他人靠近" : "主动外向，愿意开启交流";
  const feedbackText = a[6]===0 ? "正向鼓励更能带动你" : "批评建议更能促使你进步";
  const feedbackDesc = a[6]===0 ? "更容易被夸奖滋养" : "抗压能力更强，在纠错中成长";
  const conflictStyle = a[7]===0 ? "直率表达想法" : "倾向缓和避免冲突";
  const recoverWay = a[8]===0 ? "独处静养恢复能量" : "陪伴社交获取能量";
  const exploreStyle = a[9]===0 ? "先观察再动手尝试" : "直接上手不怕踩坑";

  let oldFriendReact;
  if(a[10]===0) oldFriendReact="会有些拘谨，慢慢找回相处节奏";
  else if(a[10]===1) oldFriendReact="很快熟络，迅速找回往日状态";
  else oldFriendReact="心存戒备，下意识保持距离";

  let strangerReact,boundary;
  if(a[11]===0){ strangerReact="感到不适，本能防备"; boundary="边界感很强"; }
  else if(a[11]===1){ strangerReact="平常心，礼貌简单应付"; boundary="温和有分寸"; }
  else { strangerReact="乐于敞开交谈"; boundary="开放包容"; }

  const regretMind = a[12]===0 ? "容易反复回想，陷入内耗" : "可以放下过去，向前看";
  const planBreak = a[13]===0 ? "计划被打乱会烦躁不安" : "心态灵活，可以接受变化";

  let strongPoint,weakPoint;
  if(baseColor==="务实型"){
    strongPoint="做事脚踏实地，看重现实结果，为人靠谱稳重";
    weakPoint="偶尔容易忽略情绪感受，行事略显刻板";
  }else{
    strongPoint="感知力丰富，共情能力出色，注重内心体验";
    weakPoint="容易被情绪左右想法，偶尔会理想化";
  }

  const html = `
<p>结合你的选择，你的性格底色偏向<strong>${baseColor}</strong>。</p>
<p>看待事物更看重<strong>${materialView}</strong>；在环境上，你向往<strong>${audioMind}</strong>。</p>
<p>音乐审美上偏爱${musicText}，这反映你${musicInner}。</p>
<p>生活习惯上，${planText}；做决定属于<strong>${decideType}</strong>。</p>
<p>社交模式：${socialMode}。接收反馈时，${feedbackText}，代表你${feedbackDesc}。</p>
<p>发生分歧时，你习惯${conflictStyle}；疲惫时依靠${recoverWay}回血。</p>
<p>面对新事物，你习惯${exploreStyle}。</p>
<p>许久不联系的人突然找你，${oldFriendReact}；面对陌生人搭话，${strangerReact}，属于${boundary}的人。</p>
<p>对于遗憾：${regretMind}；遭遇计划变更：${planBreak}。</p>
<br/>
<p>✅你的突出优势：${strongPoint}</p>
<p>⚠️可以留意的小短板：${weakPoint}</p>
  `;
  reportContent.innerHTML = html;
}

renderPage(true);
</script>
</body>
</html>
