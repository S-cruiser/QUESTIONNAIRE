<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>内心模式小探测</title>
<style>
/* 全局基础 & 字体 */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family: "Noto Sans SC", Inter, system-ui, sans-serif;
  color:#eef2ff;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  background:
    radial-gradient(circle at 10% 20%, rgba(103, 232, 249, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(165, 180, 252, 0.14) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(94, 234, 212, 0.08) 0%, transparent 60%),
    radial-gradient(circle at center, #0f172a 0%, #020617 100%);
}
/* 极光漂浮光斑层 */
.aurora{
  position:fixed;
  top:-10%;left:-15%;
  width:700px;height:700px;
  background:radial-gradient(circle, rgba(103,232,249,0.18) 0%, transparent 65%);
  filter:blur(90px);
  animation:aurora-drift 22s ease-in-out infinite alternate;
  pointer-events:none;z:0;
}
.starfield{
  position:fixed;
  bottom:-20%;right:-10%;
  width:600px;height:600px;
  background:radial-gradient(circle, rgba(165,180,252,0.15) 0%, transparent 60%);
  filter:blur(80px);
  animation:star-drift 26s ease-in-out infinite alternate;
  pointer-events:none;z:0;
}
@keyframes aurora-drift{
  0{transform:translate(0,0) rotate(0deg);}
  100{transform:translate(120px,180px) rotate(12deg);}
}
@keyframes star-drift{
  0{transform:translate(0,0) rotate(0deg);}
  100{transform:translate(-100px,-140px) rotate(-10deg);}
}
/* 页面容器 */
.wrap{
  position:relative;z:1;
  max-width:860px;margin:0 auto;padding:24px 16px 40px;
}
/* 顶部全局进度条 */
.top-progress-bar{
  position:fixed;top:0;left:0;width:100%;height:3px;
  background:#1e293b;overflow:hidden;z:999;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#67e8f9,#5eead4,#a5b4fc);
  transform-origin:left center;transform:scaleX(0);
  transition:transform 0.46s cubic-bezier(0.22,1,0.36,1);
}
.progress-sweep{
  position:absolute;top:0;left:0;height:100%;width:40%;
  background:linear-gradient(90deg,transparent, rgba(255,255,255,0.7), transparent);
  animation:sweep-glow 2.2s linear infinite;
}
@keyframes sweep-glow{
  0{transform:translateX(-100%);}
  100{transform:translateX(250%);}
}
/* 顶部14题圆点进度指示器 */
.dot-progress{
  display:flex;gap:6px;justify:center;margin:16px 0 22px;
}
.dot-item{
  width:8px;height:8px;border-radius:99px;background:#334155;
  transition:all 0.3s ease;
}
.dot-item.done{background:#67e8f9;box-shadow:0 0 6px #67e8f9;}
.dot-item.current{
  width:24px;background:linear-gradient(90deg,#67e8f9,#a5b4fc);
  box-shadow:0 0 10px rgba(103,232,249,0.7);
}
/* 玻璃拟态卡片通用 */
.glass-card{
  background:rgba(30,41,59,0.45);
  backdrop-filter:blur(16px);
  border:1px solid rgba(148,163,184,0.18);
  border-radius:20px;
  padding:32px 26px;
  position:relative;
  overflow:hidden;
}
.glass-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,#67e8f9,transparent);
}
/* 月相环形进度 */
.moon-progress{
  position:absolute;top:26px;right:26px;width:56px;height:56px;
  border-radius:50%;background:#1e293b;display:grid;place-items:center;
}
.moon-ring{
  width:48px;height:48px;border-radius:50%;
  background:conic-gradient(#67e8f9 0% 0%, #334155 0% 100%);
  mask:radial-gradient(transparent 62%, black 63%);
  -webkit-mask:radial-gradient(transparent 62%, black 63%);
  transition:background 0.46s cubic-bezier(0.22,1,0.36,1);
}
.moon-inner{
  width:42px;height:42px;border-radius:50%;background:#0f172a;
  display:grid;place-items:center;font-size:12px;font-weight:500;color:#cbd5e1;
}
/* 标题区域 */
.page-header h1{
  font-size:26px;text-align:center;
  background:linear-gradient(90deg,#67e8f9,#a5b4fc);
  -webkit-background-clip:text;color:transparent;
  margin-bottom:8px;
}
.page-desc{
  text-align:center;font-size:14px;color:#94a3b8;margin-bottom:24px;
}
.page-indicator{
  text-align:center;font-size:14px;color:#a5b4fc;margin-bottom:28px;
}
/* 题目区域 滑动动画 */
.question-wrap{position:relative;min-height:320px;overflow:hidden;}
.slide-right{
  animation:slideInRight 0.46s cubic-bezier(0.22,1,0.36,1) forwards;
}
.slide-left{
  animation:slideInLeft 0.46s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes slideInRight{
  from{opacity:0;transform:translateX(70px);}
  to{opacity:1;transform:translateX(0);}
}
@keyframes slideInLeft{
  from{opacity:0;transform:translateX(-70px);}
  to{opacity:1;transform:translateX(0);}
}
.q-title{
  font-size:18px;margin-bottom:26px;font-weight:500;color:#e0f2fe;
}
/* 选项按钮 交错淡入+hover流光 */
.op-item{
  padding:14px 18px;margin:12px 0;border-radius:14px;
  background:rgba(51,65,85,0.5);border:1px solid rgba(148,163,184,0.16);
  cursor:pointer;position:relative;overflow:hidden;
  transition:all 0.28s ease;opacity:0;transform:translateY(10px);
}
.op-item.ani{animation:stagger-fade 0.4s ease forwards;}
@keyframes stagger-fade{
  to{opacity:1;transform:translateY(0);}
}
.op-item::before{
  content:"";position:absolute;left:0;top:0;width:3px;height:100%;
  background:linear-gradient(#67e8f9,#a5b4fc);transform:scaleY(0);
  transition:transform 0.28s ease;
}
.op-item:hover{
  transform:translateY(-3px);border-color:rgba(103,232,249,0.4);
  box-shadow:0 6px 16px rgba(103,232,249,0.12);
}
.op-item:hover::before{transform:scaleY(1);}
.op-item.selected{
  background:linear-gradient(135deg,rgba(103,232,249,0.18),rgba(165,180,252,0.18));
  border-color:#67e8f9;
}
/* 底部按钮栏 */
.btn-row{display:flex;gap:14px;margin-top:36px;}
button{
  flex:1;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:500;
  cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden;color:#fff;
}
.btn-prev{background:rgba(71,85,105,0.6);}
.btn-next{
  background:linear-gradient(90deg,#67e8f9,#5eead4,#a5b4fc);
}
.btn-next::after{
  content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
  transition:left 0.5s ease;
}
.btn-next:hover::after{left:100%;}
.btn-next:disabled{opacity:0.45;cursor:not-allowed;transform:none;}

/* ====================== 报告结果页面 ====================== */
.result-wrap{display:none;margin-top:20px;}
.report-page{
  width:100%;
}
.report-tag-top{
  text-align:center;margin-bottom:12px;
}
.report-tag-top span{
  display:inline-block;
  border:1px solid rgba(255,255,255,0.25);
  padding:6px 20px;border-radius:999px;
  font-size:13px;letter-spacing:1px;color:#e2e8f0;
}
.report-main-title{
  text-align:center;
  font-size:32px;font-weight:600;margin-bottom:8px;color:#f1f5f9;
}
.report-subtitle{
  text-align:center;font-size:14px;color:#94a3b8;margin-bottom:32px;
}
/* 头部人物卡片 */
.report-head-card{
  background:rgba(51,70,105,0.35);
  border:1px solid rgba(148,163,184,0.2);
  border-radius:18px;
  padding:24px;
  display:flex;gap:22px;align-items:center;margin-bottom:24px;
  box-shadow:0 8px 32px rgba(0,0,0,0.25);
}
.report-avatar{
  width:110px;height:110px;border-radius:50%;
  object-fit:cover;
  background:conic-gradient(#67e8f9,#5eead4,#a5b4fc,#67e8f9);
  padding:4px;animation:rotate-glow 6s linear infinite;
}
@keyframes rotate-glow{
  100%{transform:rotate(360deg);}
}
.report-head-text .en-label{
  font-size:14px;color:#94a3b8;letter-spacing:1px;margin-bottom:6px;
}
.report-head-text .cn-title{
  font-size:24px;font-weight:600;margin-bottom:8px;
}
.report-head-text .desc{
  font-size:14px;color:#cbd5e1;
}
/* 维度模块 */
.dim-block{
  background:rgba(45,60,92,0.25);
  border:1px solid rgba(148,163,184,0.15);
  border-radius:14px;padding:18px;margin-bottom:14px;
}
.dim-label{
  display:inline-block;
  background:rgba(103,232,249,0.15);
  color:#7dd3fc;
  border:1px solid rgba(103,232,249,0.25);
  padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;margin-bottom:10px;
}
.dim-text{
  font-size:14.5px;color:#e2e8f0;line-height:1.7;
}
/* 双栏优势&小特质 */
.two-col{
  display:grid;grid-template-columns:1fr;gap:16px;margin-top:24px;
}
@media(min-width:640px){
  .two-col{grid-template-columns:1fr 1fr;}
}
.col-card{
  background:rgba(45,60,92,0.25);
  border:1px solid rgba(148,163,184,0.15);
  border-radius:14px;padding:22px;
}
.col-title{
  font-size:16px;margin-bottom:14px;color:#f1f5f9;
}
.bubble-item{
  display:inline-block;
  background:rgba(103,232,249,0.12);
  color:#b6e6f2;
  border-radius:999px;
  padding:6px 12px;
  font-size:13px;margin:4px 6px 4px 0;
}
/* 底部限定头像卡片 */
.avatar-award-card{
  background:rgba(45,60,92,0.25);
  border:1px solid rgba(103,232,249,0.25);
  border-radius:14px;padding:22px;text-align:center;margin-top:24px;
}
.avatar-award-card h3{
  font-size:18px;margin-bottom:8px;color:#f1f5f9;
}
.avatar-award-card p{
  font-size:14px;color:#94a3b8;margin-bottom:16px;
}
.avatar-award-card .avatar-preview{
  width:90px;height:90px;border-radius:50%;object-fit:cover;margin:0 auto 16px;
  background:conic-gradient(#67e8f9,#5eead4,#a5b4fc,#67e8f9);
  padding:3px;animation:rotate-glow 6s linear infinite;
}
.download-avatar{
  padding:11px 22px;border-radius:12px;
  background:rgba(103,232,249,0.2);color:#67e8f9;border:1px solid #67e8f9;
  cursor:pointer;font-size:14px;
}
.back-test{width:100%;margin-top:12px;}

/* 呼吸脉冲动画 */
@keyframes pulse-glow{
  0%,100{box-shadow:0 0 8px rgba(103,232,249,0.4);}
  50{box-shadow:0 0 20px rgba(103,232,249,0.7);}
}
.pulse{animation:pulse-glow 2.4s ease-in-out infinite;}

/* 底部说明文字 */
.report-footer-note{
  text-align:center;font-size:12px;color:#64748b;margin-top:18px;line-height:1.6;
}

@media screen and (max-width:640px){
  .report-head-card{flex-direction:column;text-align:center;}
  .report-main-title{font-size:24px;}
}
</style>
</head>
<body>
<!-- 星空极光背景层 -->
<div class="aurora"></div>
<div class="starfield"></div>
<!-- 顶部全局进度条 -->
<div class="top-progress-bar">
  <div class="progress-fill" id="topProgress"></div>
  <div class="progress-sweep"></div>
</div>
<div class="wrap">
  <div class="glass-card" id="quizCard">
    <!-- 月相环形进度 -->
    <div class="moon-progress">
      <div class="moon-ring" id="moonRing"></div>
      <div class="moon-inner" id="moonText">0/14</div>
    </div>
    <div class="page-header">
      <h1>✨内心模式小探测</h1>
      <div class="page-desc">凭第一直觉作答，14道小题解锁专属内心报告｜趣味性格测试</div>
    </div>
    <!-- 圆点进度指示器 -->
    <div class="dot-progress" id="dotWrap"></div>
    <div class="page-indicator" id="pageIndicator"></div>
    <!-- 答题区域 -->
    <div class="question-wrap">
      <div id="pageBody"></div>
    </div>
    <div class="btn-row">
      <button class="btn-prev" id="prevBtn">上一题</button>
      <button class="btn-next" id="nextBtn">下一题</button>
    </div>
  </div>

  <!-- 报告结果页面 -->
  <div class="result-wrap" id="resultWrap">
    <div class="report-page">
      <div class="report-tag-top"><span>YOUR REPORT</span></div>
      <h1 class="report-main-title">你的内心模式探测报告</h1>
      <div class="report-subtitle">基于你对 14 道题的直觉选择</div>

      <!-- 头部人物卡片 -->
      <div class="report-head-card">
        <img id="rewardAvatar" class="report-avatar" src="./cat.png" alt="头像">
        <div class="report-head-text">
          <div class="en-label" id="reportEn">PRAGMATIST</div>
          <div class="cn-title" id="reportTitle">务实型 · 深海潜行者</div>
          <div class="desc" id="reportDesc">结合全部选择可以看出，你的性格底色偏向【务实型】。</div>
        </div>
      </div>

      <!-- 维度区块容器 -->
      <div id="dimContainer"></div>

      <!-- 双栏：优势 / 小特质 -->
      <div class="two-col">
        <div class="col-card">
          <div class="col-title">✦ 你的突出优势</div>
          <div id="advBox"></div>
        </div>
        <div class="col-card">
          <div class="col-title">○ 容易显露的小特质</div>
          <div id="weakBox"></div>
        </div>
      </div>

      <!-- 底部限定头像卡片 -->
      <div class="avatar-award-card">
        <h3>✨ 你获得限定头像</h3>
        <p>完成本次内心模式探测，解锁专属头像徽章</p>
        <img class="avatar-preview pulse" src="./cat.png" alt="限定头像">
        <br>
        <button class="download-avatar" onclick="downloadAvatar()">保存头像徽章</button>
        <button class="btn-next back-test" onclick="resetQuiz()">重新开始探测</button>
      </div>

      <!-- 底部说明 -->
      <p class="report-footer-note">
        本测试为趣味性格探索内容，仅供娱乐参考，不代表专业心理评估结果。
      </p>
    </div>
  </div>
</div>

<script>
// 完整题库（14维度）
const questions = [
  { dim:"物质", q:"1.挑选随身小物件时你的倾向", opts:["A 优先实用耐用，外观过得去即可","B 优先观感审美，基础功能够用就好"] },
  { dim:"听觉", q:"2.日常佩戴耳机更偏好", opts:["A 不封闭耳道，可以听见周遭环境声音","B 隔绝外界噪音，拥有私人听觉空间"] },
  { dim:"音乐", q:"3.更容易被哪一类音乐触动", opts:["A 舒缓安静，氛围感强","B 节奏浓烈，情绪冲击力强","C 广为流传的大众热门曲目","D 小众冷门，受众不多的作品"] },
  { dim:"规划", q:"4.对待待办的事情，你更习惯", opts:["A 提前规划妥当，一切确定才安心","B 随情况调整，接纳随机的变化"] },
  { dim:"决策", q:"5.面临重要抉择，你的状态", opts:["A 多方权衡，会犹豫很久再定下来","B 快速做出判断，愿意承担试错结果"] },
  { dim:"社交", q:"6.日常社交当中你的固有模式", opts:["A 偏向被动，等待别人主动靠近","B 偏向主动，会主动发起交流"] },
  { dim:"反馈", q:"7.他人给予反馈，更能驱动你的是", opts:["A 夸奖与正向肯定","B 指出不足的批评建议"] },
  { dim:"冲突", q:"8.与他人产生观点分歧时", opts:["A 直接表达自身想法，不刻意迂回","B 缓和气氛，尽量避免冲突激化"] },
  { dim:"回血", q:"9.疲惫之后恢复精神，你更喜欢", opts:["A 安静独处，不受外界打扰","B 热闹环境，有人陪伴相处"] },
  { dim:"新鲜事物", q:"10.接触完全陌生的新鲜事物", opts:["A 先观察了解，再亲身尝试","B 直接上手体验，不怕出错踩坑"] },
  { dim:"旧友", q:"11.面对许久未见、很久不联系的人突然来找你", opts:["A 会有点拘谨，慢慢找回相处节奏","B 自然熟络，很快就能恢复往日状态","C 内心会有所戒备，保持距离感"] },
  { dim:"陌生人", q:"12.陌生人主动过来和你谈论相关你的事情", opts:["A 有点不适，下意识防备","B 平常心，可以简单礼貌应付","C 乐于交谈，愿意敞开去沟通"] },
  { dim:"遗憾", q:"13.面对过往留下的遗憾", opts:["A 时常回想，容易反复纠结内耗","B 快速放下，很少回头沉浸过去"] },
  { dim:"变动", q:"14.计划被别人临时打乱的时候", opts:["A 会感到烦躁，不太适应变动","B 可以接受，灵活调整即可"] }
];

let currentPage = 0;
let answers = Array(questions.length).fill(null);
const total = questions.length;

const topProgress = document.getElementById("topProgress");
const moonRing = document.getElementById("moonRing");
const moonText = document.getElementById("moonText");
const dotWrap = document.getElementById("dotWrap");
const pageIndicator = document.getElementById("pageIndicator");
const pageBody = document.getElementById("pageBody");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const quizCard = document.getElementById("quizCard");
const resultWrap = document.getElementById("resultWrap");

const reportEn = document.getElementById("reportEn");
const reportTitle = document.getElementById("reportTitle");
const reportDesc = document.getElementById("reportDesc");
const dimContainer = document.getElementById("dimContainer");
const advBox = document.getElementById("advBox");
const weakBox = document.getElementById("weakBox");
const avatarImg = document.getElementById("rewardAvatar");

// 头像下载功能
function downloadAvatar(){
  const link = document.createElement("a");
  link.href = avatarImg.src;
  link.download = "内心模式专属头像.png";
  document.body.appendChild(link);
  link.click();
  link.remove();
}

// 渲染圆点进度指示器
function renderDots(){
  dotWrap.innerHTML = "";
  for(let i=0;i<total;i++){
    const dot = document.createElement("div");
    dot.className = "dot-item";
    if(i < currentPage) dot.classList.add("done");
    if(i === currentPage) dot.classList.add("current");
    dotWrap.appendChild(dot);
  }
}

// 更新进度
function updateAllProgress(){
  const percent = (currentPage+1)/total;
  topProgress.style.transform = `scaleX(${percent})`;
  moonRing.style.background = `conic-gradient(#67e8f9 ${percent*100}%, #334155 ${percent*100}% 100%)`;
  moonText.innerText = `${currentPage+1}/${total}`;
  renderDots();
  pageIndicator.innerText = `第 ${currentPage+1} / ${total} 题 · ${questions[currentPage].dim}维度`;
}

// 渲染题目
function renderPage(isForward=true){
  const q = questions[currentPage];
  pageBody.innerHTML = `<div class="q-title">${q.q}</div>`;
  q.opts.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "op-item";
    div.style.animationDelay = `${i*60}ms`;
    div.innerText = opt;
    setTimeout(()=>div.classList.add("ani"),10);
    if(answers[currentPage] === i) div.classList.add("selected");
    div.onclick = ()=>{
      answers[currentPage] = i;
      renderPage(isForward);
    }
    pageBody.appendChild(div);
  })
  pageBody.className = isForward ? "slide-right" : "slide-left";
  updateAllProgress();
  prevBtn.style.visibility = currentPage===0 ? "hidden":"visible";
  if(answers[currentPage] === null){
    nextBtn.disabled = true;
    nextBtn.innerText = "下一题";
  }else{
    nextBtn.disabled = false;
    nextBtn.innerText = currentPage === total-1 ? "查看完整报告" : "下一题";
  }
}

// 翻页逻辑
prevBtn.onclick = ()=>{
  if(currentPage>0){currentPage--;renderPage(false);}
}
nextBtn.onclick = ()=>{
  if(currentPage < total-1){
    currentPage++;renderPage(true);
  }else{
    generateReport();
    quizCard.style.display = "none";
    resultWrap.style.display = "block";
  }
}

// 重置测试
function resetQuiz(){
  currentPage = 0;
  answers = Array(total).fill(null);
  quizCard.style.display = "block";
  resultWrap.style.display = "none";
  renderPage(true);
}

// 生成报告
function generateReport(){
  const a = answers;

  const baseType = a[0]===0 ? "务实型" : "感受型";
  const baseEn = baseType === "务实型" ? "PRAGMATIST" : "SENTIMENTALIST";
  const titleName = baseType === "务实型" ? "深海潜行者" : "月光收藏家";

  reportEn.innerText = baseEn;
  reportTitle.innerText = `${baseType} · ${titleName}`;
  reportDesc.innerText = `结合全部选择可以看出，你的性格底色偏向【${baseType}】。`;

  const dimData = [];

  let s1 = a[0]===0
    ?"物质层面，看待事物更看重实际使用价值；听觉习惯投射出，你更向往拥有隔绝干扰的私人空间。"
    :"物质层面，看待事物更看重观感氛围感；听觉习惯投射出，你倾向和外界环境保持感知连通。";
  dimData.push({label:"物质与感知",text:s1});

  let s2;
  if(a[2]===0){
    s2="音乐审美上你偏爱舒缓安静、氛围感强的类型，这侧面体现你内心渴望安宁、细腻敏感，习惯在低饱和的情绪里与自己相处。";
  }else if(a[2]===1){
    s2="音乐审美上偏爱节奏浓烈、情绪冲击力强的作品，内心情绪张力充足，容易被热烈的表达打动。";
  }else if(a[2]===2){
    s2="音乐审美偏向大众热门曲目，更容易共情群体情绪，喜欢拥有共鸣感的内容。";
  }else{
    s2="音乐审美偏向小众冷门作品，拥有独立的审美体系，不盲从大众潮流。";
  }
  dimData.push({label:"音乐审美",text:s2});

  const planText = a[3]===0?"偏爱提前规划，不喜欢突发打乱":"接纳变数，适应随性状态";
  const decText = a[4]===0?"审慎思虑型":"果敢行动型";
  dimData.push({label:"节奏与决策",text:`生活节奏方面，${planText}；做决策属于【${decText}】。`});

  const socText = a[5]===0?"被动慢热，习惯等待他人靠近":"主动外向，愿意主动开启交流";
  const feedText = a[6]===0?"更依赖正向鼓励滋养情绪":"更愿意接受批评建议推动成长";
  dimData.push({label:"社交与反馈",text:`社交模式属于【${socText}】。接收外界评价时，${feedText}。`});

  const confText = a[7]===0?"坦率直接，敢于亮出立场":"温和迂回，优先缓和冲突";
  const recText = a[8]===0?"依靠独处静养回血":"依靠陪伴社交恢复精力";
  dimData.push({label:"冲突与回血",text:`发生观念冲突时，你的处事风格是【${confText}】；精力恢复则依靠【${recText}】。`});

  const expText = a[9]===0?"先观望再行动":"直接上手体验，不惧踩坑";
  dimData.push({label:"探索欲",text:`面对全新未知事物，你习惯【${expText}】。`});

  let oldStr;
  if(a[10]===0) oldStr="久未联系的故人找你，你会有一点拘谨，需要时间慢慢找回相处的节奏";
  else if(a[10]===1) oldStr="久未联系的故人找你，可以很快熟络，快速恢复往日相处状态";
  else oldStr="久未联系的故人找你，内心会升起戒备，会刻意拉开距离";

  let strangerStr;
  if(a[11]===0) strangerStr="遭遇陌生人谈及自己，本能产生防备，会下意识回避话题";
  else if(a[11]===1) strangerStr="遭遇陌生人谈及自己，礼貌应付保持分寸，人际边界属于【温和中立】";
  else strangerStr="遭遇陌生人谈及自己，乐于接住话题，愿意敞开自己去沟通，能看出你在人际边界上属于【开放包容】";

  dimData.push({label:"人际边界",text:`人际上，${oldStr}；${strangerStr}。`});

  const changeStr = a[13]===0?"容易产生抵触情绪":"可以接纳变化快速调整";
  const regretStr = a[12]===0?"容易反复回想内耗":"更容易放下过往向前看";
  dimData.push({label:"应变与释怀",text:`遭遇计划被打乱，你【${changeStr}】；对待过往遗憾，【${regretStr}】。`});

  dimContainer.innerHTML = "";
  dimData.forEach(d=>{
    const block = document.createElement("div");
    block.className = "dim-block";
    block.innerHTML = `
        <span class="dim-label">${d.label}</span>
        <div class="dim-text">${d.text}</div>
    `;
    dimContainer.appendChild(block);
  })

  let advList,weakList;
  if(baseType === "务实型"){
    advList = ["务实可靠，处理事务有章法、能落地","弹性强，在变化中仍能稳步前行","拥有丰盈的内心世界，独处时也不觉空虚"];
    weakList = ["偶尔会因思虑过多而错过最佳时机","在热闹场合容易耗能，需要较长时间回血","表达直接，偶尔会无意中伤到身边人","对过往遗憾难以释怀，容易反复内耗"];
  }else{
    advList = ["共情细腻，可以敏锐捕捉他人情绪","想象力丰富，拥有很强感受力","待人温柔包容，擅长照顾氛围"];
    weakList = ["容易被情绪裹挟，做事容易理想化","规划感偏弱，突发变动容易慌乱","容易过度共情别人，消耗自身精力","对遗憾反复回味，陷入情绪内耗"];
  }
  advBox.innerHTML = advList.map(i=>`<span class="bubble-item">${i}</span>`).join("");
  weakBox.innerHTML = weakList.map(i=>`<span class="bubble-item">${i}</span>`).join("");
}

// 页面初始化
renderPage(true);
</script>
</body>
